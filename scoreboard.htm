<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Scoreboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .scoreboard {
      background-color: #1a1a1a;
      border: 4px solid #333;
      border-radius: 12px;
      padding: 24px;
      width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      color: #fff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .timer-display, .period-display { text-align: center; }
    .label { font-size: 0.75rem; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
    .clock, .period {
      font-size: 1.8rem;
      background: #000;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #444;
    }
    .clock { color: #ff3333; }
    .period { color: #ffb703; }
    .teams-container { display: flex; justify-content: space-between; gap: 20px; }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0d0d0d;
      padding: 16px;
      border-radius: 8px;
    }
    .team-name { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; }
    .score {
      font-size: 3rem;
      color: #00ff66;
      background-color: #000;
      width: 100%;
      text-align: center;
      border-radius: 6px;
      border: 1px solid #222;
      margin-bottom: 12px;
      padding: 5px 0;
    }
    .controls { display: flex; gap: 6px; }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    button:hover { background: #555; }
  </style>
</head>
<body>

  <div class="scoreboard">
    <div class="header">
      <div class="period-display">
        <div class="label">PERIOD</div>
        <div class="period" id="period">1</div>
      </div>
      <div class="timer-display">
        <div class="label">SHOT CLOCK</div>
        <div class="clock" id="shot-clock">24</div>
      </div>
    </div>

    <div class="teams-container">
      <div class="team">
        <div class="team-name">HOME</div>
        <div class="score" id="home-score">0</div>
        <div class="controls">
          <button onclick="home1()">+1</button>
          <button onclick="home2()">+2</button>
          <button onclick="home3()">+3</button>
        </div>
      </div>

      <div class="team">
        <div class="team-name">GUEST</div>
        <div class="score" id="away-score">0</div>
        <div class="controls">
          <button onclick="away1()">+1</button>
          <button onclick="away2()">+2</button>
          <button onclick="away3()">+3</button>
        </div>
      </div>
    </div>
  </div>

  <script src="score.js">

  </script>
</body>
</html>
